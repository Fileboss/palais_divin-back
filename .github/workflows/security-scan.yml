name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp verify -P security-scan -DskipTests -DskipITs -Dspotless.check.skip=true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
            target/dependency-check-report.sarif
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two passes on purpose. `format: sarif` writes to a file, so a failing
      # run shows nothing but "exit code 1" in the log — this first pass prints
      # the findings table to stdout and is the one that gates the build.
      #
      # Tags on this action are v-prefixed. `@0.24.0` (no v) never existed and
      # fails the run before Trivy is even installed.
      - name: Run Trivy (gating, table output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-dirs: target,node_modules

      # SARIF for the uploaded artifact. `limit-severities-for-sarif` is
      # mandatory here: without it the action runs `unset TRIVY_SEVERITY` and
      # reports every severity. `exit-code: 0` because the step above already
      # gated; `if: always()` so the report still gets produced when it failed.
      - name: Run Trivy (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy.sarif
          skip-dirs: target,node_modules

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn
          retention-days: 30
